<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#180b33" />
      <stop offset="100%" stop-color="#05030a" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#neonGlow)" stroke-width="6" opacity="0.8" />

  <!-- Cyber Grid Horizon -->
  <path d="M 60 360 L 452 360" stroke="#06b6d4" stroke-width="2" opacity="0.4" />
  <path d="M 40 400 L 472 400" stroke="#06b6d4" stroke-width="3" opacity="0.5" />
  <path d="M 20 450 L 492 450" stroke="#a855f7" stroke-width="4" opacity="0.6" />
  
  <!-- Perspective Road Lines -->
  <path d="M 256 260 L 90 490" stroke="url(#neonGlow)" stroke-width="6" opacity="0.7" />
  <path d="M 256 260 L 422 490" stroke="url(#neonGlow)" stroke-width="6" opacity="0.7" />
  <path d="M 256 260 L 256 490" stroke="#f59e0b" stroke-width="5" stroke-dasharray="24 16" opacity="0.9" />

  <!-- Glowing Sun / Portal -->
  <circle cx="256" cy="230" r="85" fill="url(#neonGlow)" filter="url(#glow)" opacity="0.9" />
  <circle cx="256" cy="230" r="70" fill="#090514" />
  
  <!-- Running Cyber Character Silhouette / Lightning Bolt -->
  <path d="M 270 160 L 220 230 L 260 230 L 235 300 L 300 220 L 260 220 Z" fill="#38bdf8" filter="url(#glow)" />
  
  <!-- Stylized Sunglasses Icon -->
  <path d="M 205 195 C 205 185 240 185 245 195 L 267 195 C 272 185 307 185 307 195 C 307 205 295 215 280 215 C 265 215 260 205 256 202 C 252 205 247 215 232 215 C 217 215 205 205 205 195 Z" fill="#c084fc" opacity="0.95" />

  <!-- Brand Typography -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">
    NEON RUNNER
  </text>
  <text x="256" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#a855f7" letter-spacing="8">
    AFROBEATS 3D
  </text>
</svg>
