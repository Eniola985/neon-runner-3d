<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Runner 3D - Afrobeats & Worldwide Music Game</title>
    <meta name="description" content="High-octane 3D cyberpunk endless runner with real-time procedural Afrobeats and worldwide music." />
    <meta property="og:title" content="Neon Runner 3D - Afrobeats & Worldwide Music Game" />
    <meta property="og:description" content="High-octane 3D cyberpunk endless runner with real-time procedural Afrobeats and worldwide music." />
    <meta name="theme-color" content="#090514" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NeonRunner" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Suppress Vite HMR websocket disconnection notice in Cloud proxy environments
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.filename?.includes('@vite/client'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && (String(e.reason)?.includes('WebSocket') || String(e.reason)?.includes('@vite/client'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
